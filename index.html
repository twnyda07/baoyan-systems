<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="寶嚴禪寺工作人員常用系統的入口，分課程、法務、行政事務三類。">
<title>寶嚴系統總覽</title>
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#1E1C19; --ink2:#4A453F; --ink3:#7A736A;
  --line:#E4DFD5;
  --blue:#0F2E63; --blueSoft:#EEF2F8; --gold:#B8924A;
  --lock:#7A5A1E; --lockBg:#F7F0E1; --open:#2F5A3E; --openBg:#EBF3EC; --done:#6B6B6B; --doneBg:#EFEFEC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16171A; --card:#1E2024; --ink:#ECE8E1; --ink2:#C6C0B6; --ink3:#958E84;
    --line:#2F3238;
    --blue:#9DB8E6; --blueSoft:#1D2533; --gold:#D4AF6A;
    --lock:#E2C48A; --lockBg:#2B2519; --open:#9FD0AE; --openBg:#1C2A21; --done:#A8A8A8; --doneBg:#26272A;
  }
}
:root[data-theme="dark"]{
  --paper:#16171A; --card:#1E2024; --ink:#ECE8E1; --ink2:#C6C0B6; --ink3:#958E84;
  --line:#2F3238;
  --blue:#9DB8E6; --blueSoft:#1D2533; --gold:#D4AF6A;
  --lock:#E2C48A; --lockBg:#2B2519; --open:#9FD0AE; --openBg:#1C2A21; --done:#A8A8A8; --doneBg:#26272A;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.6}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

header.top{padding:28px 0 8px}
.brand{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;font-weight:700;letter-spacing:.06em;margin:0}
.brand::after{content:"";display:block;width:36px;height:2px;background:var(--gold);margin-top:10px}
.sub{color:var(--ink3);font-size:15px;margin:10px 0 0}

.bar{position:sticky;top:0;z-index:10;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px}
.search svg{flex:none;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:12px 0}
.search button{border:0;background:transparent;color:var(--ink3);font:inherit;font-size:15px;min-height:44px;min-width:44px;cursor:pointer;display:none}
.search.has button{display:block}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:16px;
  min-height:44px;padding:0 10px;border-radius:22px;cursor:pointer;white-space:nowrap}
.tab .n{color:var(--ink3);font-size:12px;margin-left:3px}
@media (min-width:640px){.tabs{gap:8px}.tab{flex:none;padding:0 18px}}
.tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.75}

main{padding:8px 0 40px}
section.cat{margin-top:26px;scroll-margin-top:130px}
section.cat>h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:22px;margin:0 0 2px;letter-spacing:.05em}
section.cat>p.lead{color:var(--ink3);font-size:15px;margin:0 0 6px}
h3.grp{font-size:15px;font-weight:600;color:var(--ink2);margin:20px 0 10px;padding-left:10px;border-left:3px solid var(--gold);line-height:1.3}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card .name{font-size:18px;font-weight:600;line-height:1.4;margin:0}
.card .desc{color:var(--ink2);font-size:15px;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;line-height:1;padding:5px 8px;border-radius:6px;white-space:nowrap}
.t-lock{background:var(--lockBg);color:var(--lock)}
.t-open{background:var(--openBg);color:var(--open)}
.t-done{background:var(--doneBg);color:var(--done)}
.t-note{background:var(--blueSoft);color:var(--blue)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;
  text-decoration:none;font:inherit;font-size:16px;background:var(--blueSoft);color:var(--blue);border:1px solid transparent;font-weight:600;cursor:pointer}
.go:hover,.go:focus-visible{border-color:var(--blue)}
.go.copy{background:transparent;border:1px solid var(--line);color:var(--ink3);font-weight:400}
.empty{color:var(--ink3);text-align:center;padding:40px 0;display:none}

.help{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.help h2{font-size:17px;margin:0 0 6px}
.help h2+p{margin-top:0}
.help p{margin:6px 0 14px;color:var(--ink2);font-size:15px}
.help p:last-child{margin-bottom:0}
footer{color:var(--ink3);font-size:13px;padding:20px 16px 32px}
.theme{border:1px solid var(--line);background:transparent;color:var(--ink3);font:inherit;font-size:13px;min-height:44px;padding:0 12px;border-radius:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1 class="brand">寶嚴系統總覽</h1>
    <p class="sub">工作人員常用的系統都在這裡，分課程、法務、行政事務三類。按「開啟」就會在新分頁打開。</p>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <label class="search" id="searchBox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋，例如：排車、SOP、會計" autocomplete="off" aria-label="搜尋系統">
      <button type="button" id="clear" aria-label="清除搜尋">清除</button>
    </label>
    <nav class="tabs" id="tabs" aria-label="分類"></nav>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <p class="empty" id="empty">找不到符合的系統，換個關鍵字試試。</p>

  <div class="help">
    <h2>需要通行碼的系統</h2>
    <p>標示「需通行碼」的系統，請向負責的執事索取通行碼；本頁不提供任何密碼。</p>
    <h2>通行碼正確卻進不去</h2>
    <p>多半是瀏覽器還留著舊頁面。電腦請強制重新整理；手機請把分頁整個關掉再重新開啟。</p>
  </div>
</div>

<footer class="wrap">
  <p>寶嚴山寶嚴禪寺．最後整理 2026-11-03</p>
  <button class="theme" id="theme" type="button">切換深色／淺色</button>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IDS = CATS.map(c => c.id);
let cur = "all";
try { const t = localStorage.getItem("by-sys-tab"); if (t === "all" || IDS.includes(t)) cur = t; } catch(e) {}
if (IDS.includes(location.hash.slice(1))) cur = location.hash.slice(1);

const count = cat => cat.groups.reduce((a,g) => a + g.items.length, 0);

function renderTabs(){
  const total = CATS.reduce((a,c) => a + count(c), 0);
  const list = [["all","全部",total], ...CATS.map(c => [c.id, c.name, count(c)])];
  $("#tabs").innerHTML = list.map(([id,name,n]) =>
    `<button class="tab" type="button" data-id="${id}" aria-pressed="${id===cur}">${name}<span class="n">${n}</span></button>`).join("");
}

function tagHTML(it){
  let t = it.s === "lock" ? `<span class="tag t-lock">需通行碼</span>` : `<span class="tag t-open">直接開啟</span>`;
  if (it.done) t += `<span class="tag t-done">已結束．可回查</span>`;
  if (it.note) t += `<span class="tag t-note">${esc(it.note)}</span>`;
  return t;
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  $("#searchBox").classList.toggle("has", !!q);
  let shown = 0, html = "";
  for (const cat of CATS){
    if (!q && cur !== "all" && cat.id !== cur) continue;
    let ch = "";
    for (const g of cat.groups){
      const items = g.items.filter(it => !q || (it.n+" "+it.d+" "+it.k+" "+g.name+" "+cat.name).toLowerCase().includes(q));
      if (!items.length) continue;
      shown += items.length;
      ch += `<h3 class="grp">${esc(g.name)}</h3><div class="grid">` + items.map(it => `
        <article class="card">
          <h4 class="name">${esc(it.n)}</h4>
          <p class="desc">${esc(it.d)}</p>
          <div class="tags">${tagHTML(it)}</div>
          <div class="links">${it.links.map(([l,u]) =>
            `<a class="go" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} →</a>`).join("")}
            <button class="go copy" type="button" data-url="${esc(it.links[0][1])}">複製網址</button>
          </div>
        </article>`).join("") + `</div>`;
    }
    if (ch) html += `<section class="cat" id="sec-${cat.id}"><h2>${esc(cat.name)}</h2><p class="lead">${esc(cat.lead)}</p>${ch}</section>`;
  }
  $("#main").innerHTML = html;
  $("#empty").style.display = shown ? "none" : "block";
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  cur = b.dataset.id;
  try { localStorage.setItem("by-sys-tab", cur); } catch(e) {}
  history.replaceState(null, "", cur === "all" ? location.pathname : "#" + cur);
  renderTabs(); render();
  const top = $(".bar").getBoundingClientRect().top + window.scrollY;
  if (window.scrollY > top) window.scrollTo({top, behavior:"smooth"});
});
$("#q").addEventListener("input", render);
$("#clear").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); }
$("#main").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const url = b.dataset.url;
  try { await navigator.clipboard.writeText(url); toast("已複製網址"); }
  catch(err){
    const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("已複製網址"); } catch(e2){ toast(url); }
    ta.remove();
  }
});

$("#theme").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("by-sys-theme", r.dataset.theme); } catch(e) {}
});
try { const th = localStorage.getItem("by-sys-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch(e) {}

renderTabs(); render();
</script>
</body>
</html>
