<title>寶嚴系統總覽</title>
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#1E1C19; --ink2:#4A453F; --ink3:#7A736A;
  --line:#E4DFD5; --press:#F1EEE7;
  --blue:#0F2E63; --blueSoft:#EEF2F8; --gold:#B8924A;
  --lock:#7A5A1E; --lockBg:#F7F0E1; --done:#6B6B6B; --doneBg:#EFEFEC;
  --navH:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16171A; --card:#1E2024; --ink:#ECE8E1; --ink2:#C6C0B6; --ink3:#958E84;
    --line:#2F3238; --press:#272A30;
    --blue:#9DB8E6; --blueSoft:#1D2533; --gold:#D4AF6A;
    --lock:#E2C48A; --lockBg:#2B2519; --done:#A8A8A8; --doneBg:#26272A;
  }
}
:root[data-theme="dark"]{
  --paper:#16171A; --card:#1E2024; --ink:#ECE8E1; --ink2:#C6C0B6; --ink3:#958E84;
  --line:#2F3238; --press:#272A30;
  --blue:#9DB8E6; --blueSoft:#1D2533; --gold:#D4AF6A;
  --lock:#E2C48A; --lockBg:#2B2519; --done:#A8A8A8; --doneBg:#26272A;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.5;
  padding-bottom:calc(var(--navH) + env(safe-area-inset-bottom) + 16px)}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

header.top{padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.brand{font-family:"Noto Serif TC","Songti TC",serif;font-size:22px;font-weight:700;letter-spacing:.06em;margin:0;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:4px;height:22px;background:var(--gold);border-radius:2px}
.sub{color:var(--ink3);font-size:14px;margin:4px 0 0}

/* 搜尋列：手機上黏在最上方 */
.bar{position:sticky;top:0;z-index:10;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px;min-height:48px}
.search svg{flex:none;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;-webkit-appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:transparent;color:var(--ink3);font:inherit;font-size:15px;min-height:44px;min-width:56px;cursor:pointer;display:none}
.search.has button{display:block}

/* 分類：手機在螢幕底部（拇指按得到），寬螢幕在搜尋列下方 */
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:16px;
  min-height:44px;padding:0 18px;border-radius:22px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab svg{display:none}
.tab .n{color:var(--ink3);font-size:13px}
.tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.75}
@media (max-width:767px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:0;
    background:var(--card);border-top:1px solid var(--line);
    padding:0 0 env(safe-area-inset-bottom)}
  .tab{flex:1 1 0;flex-direction:column;justify-content:center;gap:2px;min-height:var(--navH);padding:4px 0;
    border:0;border-radius:0;background:transparent;font-size:13px;color:var(--ink3)}
  .tab svg{display:block}
  .tab .n{display:none}
  .tab[aria-pressed="true"]{background:transparent;color:var(--blue);font-weight:600}
}

main{padding:4px 0 8px}
section.cat{margin-top:18px;scroll-margin-top:80px}
section.cat>h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;margin:0;letter-spacing:.05em}
h3.grp{font-size:14px;font-weight:600;color:var(--ink3);margin:14px 0 6px;letter-spacing:.03em}

/* 一列一套系統：整列都可以按 */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (min-width:768px){
  .list{display:grid;grid-template-columns:1fr 1fr;background:transparent;border:0;border-radius:0;gap:10px}
  .list .item{border:1px solid var(--line)!important;border-radius:12px;background:var(--card)}
}
.item{display:flex;flex-wrap:wrap;align-items:stretch;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.main{flex:1;min-width:0;display:block;text-decoration:none;padding:12px 4px 12px 16px;min-height:60px}
.main:active{background:var(--press)}
.nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px;font-weight:600;line-height:1.35}
.ds{color:var(--ink3);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:12px;font-weight:500;line-height:1;padding:4px 6px;border-radius:5px;white-space:nowrap}
.t-lock{background:var(--lockBg);color:var(--lock)}
.t-done{background:var(--doneBg);color:var(--done)}
.t-note{background:var(--blueSoft);color:var(--blue)}
.cp{flex:none;width:52px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:11px}
.cp:active{background:var(--press)}
.more{flex-basis:100%;display:flex;gap:8px;padding:0 16px 12px}
.more a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--blueSoft);color:var(--blue);
  text-decoration:none;font-size:15px;font-weight:600}
.empty{color:var(--ink3);text-align:center;padding:40px 0;display:none}

.help{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.help details{border-top:1px solid var(--line)}
.help details:first-child{border-top:0}
.help summary{min-height:52px;display:flex;align-items:center;font-size:16px;font-weight:600;cursor:pointer;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"＋";margin-left:auto;color:var(--ink3);font-weight:400}
.help details[open] summary::after{content:"－"}
.help p{margin:0 0 14px;color:var(--ink2);font-size:15px}
footer{color:var(--ink3);font-size:13px;padding-top:16px;padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer p{margin:0}
.theme{border:1px solid var(--line);background:transparent;color:var(--ink3);font:inherit;font-size:13px;min-height:44px;padding:0 12px;border-radius:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:30}
.toast.on{opacity:1}
</style>
</head>

      <p>請向負責的執事索取通行碼，本頁不提供任何密碼。沒有標示的系統，點了就直接開啟。</p>
    </details>
    <details>
      <summary>通行碼正確卻進不去</summary>
      <p>多半是瀏覽器還留著舊頁面。手機請把分頁整個關掉再重新開啟；電腦請強制重新整理。</p>
    </details>
    <details>
      <summary>把這頁放到手機主畫面</summary>
      <p>iPhone：用 Safari 開這頁 → 按下方「分享」→「加入主畫面」。<br>Android：用 Chrome 開這頁 → 右上角「⋮」→「加到主畫面」。<br>之後點桌面上的「寶嚴系統」圖示就能直接打開。</p>
    </details>
  </div>

  <footer>
    <p>寶嚴山寶嚴禪寺．最後整理 2026-11-03</p>
    <button class="theme" id="theme" type="button">深色／淺色</button>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const COPY_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IDS = CATS.map(c => c.id);
let cur = "all";
try { const t = localStorage.getItem("by-sys-tab"); if (t === "all" || IDS.includes(t)) cur = t; } catch(e) {}
if (IDS.includes(location.hash.slice(1))) cur = location.hash.slice(1);

const count = cat => cat.groups.reduce((a,g) => a + g.items.length, 0);

function renderTabs(){
  const total = CATS.reduce((a,c) => a + count(c), 0);
  const list = [["all","全部",total], ...CATS.map(c => [c.id, c.name, count(c)])];
  $("#tabs").innerHTML = list.map(([id,name,n]) =>
    `<button class="tab" type="button" data-id="${id}" aria-pressed="${id===cur}">${ICONS[id]}<span>${name}</span><span class="n">${n}</span></button>`).join("");
}

function tagHTML(it){
  let t = "";
  if (it.s === "lock") t += `<span class="tag t-lock">通行碼</span>`;
  if (it.done) t += `<span class="tag t-done">已結束</span>`;
  if (it.note) t += `<span class="tag t-note">${esc(it.note)}</span>`;
  return t;
}

function itemHTML(it){
  const [first, ...rest] = it.links;
  return `<div class="item">
    <a class="main" href="${esc(first[1])}" target="_blank" rel="noopener">
      <div class="nm">${esc(it.n)}${tagHTML(it)}</div>
      <div class="ds">${esc(it.d)}</div>
    </a>
    <button class="cp" type="button" data-url="${esc(first[1])}" aria-label="複製「${esc(it.n)}」網址">${COPY_ICON}複製</button>
    ${rest.length ? `<div class="more">${it.links.map(([l,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}</div>` : ""}
  </div>`;
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  $("#searchBox").classList.toggle("has", !!q);
  let shown = 0, html = "";
  for (const cat of CATS){
    if (!q && cur !== "all" && cat.id !== cur) continue;
    let ch = "";
    for (const g of cat.groups){
      const items = g.items.filter(it => !q || (it.n+" "+it.d+" "+it.k+" "+g.name+" "+cat.name).toLowerCase().includes(q));
      if (!items.length) continue;
      shown += items.length;
      ch += `<h3 class="grp">${esc(g.name)}</h3><div class="list">${items.map(itemHTML).join("")}</div>`;
    }
    if (ch) html += `<section class="cat" id="sec-${cat.id}"><h2>${esc(cat.name)}</h2>${ch}</section>`;
  }
  $("#main").innerHTML = html;
  $("#empty").style.display = shown ? "none" : "block";
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  cur = b.dataset.id;
  try { localStorage.setItem("by-sys-tab", cur); } catch(e) {}
  history.replaceState(null, "", cur === "all" ? location.pathname : "#" + cur);
  if ($("#q").value) $("#q").value = "";
  renderTabs(); render();
  window.scrollTo({top:0, behavior:"smooth"});
});
$("#q").addEventListener("input", render);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#clear").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); }
$("#main").addEventListener("click", async e => {
  const b = e.target.closest(".cp"); if (!b) return;
  const url = b.dataset.url;
  try { await navigator.clipboard.writeText(url); toast("已複製網址，可以貼到 LINE"); }
  catch(err){
    const ta = document.createElement("textarea"); ta.value = url; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("已複製網址，可以貼到 LINE"); } catch(e2){ toast(url); }
    ta.remove();
  }
});

$("#theme").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("by-sys-theme", r.dataset.theme); } catch(e) {}
});
try { const th = localStorage.getItem("by-sys-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch(e) {}

renderTabs(); render();
</script>
</body>
</html>
